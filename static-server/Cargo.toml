[package]
name = "gaubeeos-server"
version = "0.1.0"
edition = "2021"
description = "GaubeeOS 服务端：静态托管 + 内容订阅引擎（GitHub 源 → 本地缓存 → /api/*）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
mime_guess = "2"
# 订阅引擎：GitHub API 客户端（rustls 免 openssl，musl 静态编译友好）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humantime = "2"
# 会话 token 随机数（最小依赖，无传递）
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 体积优先（scratch 镜像）：LTO + strip + 单 codegen unit，
# opt-level=2 在静态文件场景与 3 无感知差异
[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 2
